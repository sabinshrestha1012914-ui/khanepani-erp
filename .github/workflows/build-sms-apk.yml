name: Build Pragati Jal SMS Gateway APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-sms-gateway/**"
      - ".github/workflows/build-sms-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-sms-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        shell: bash
        run: |
          set +o pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          SM=$(command -v sdkmanager || find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses >/dev/null || true
            "$SM" "platforms;android-34" "build-tools;34.0.0"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: PragatiJal-SMS-Gateway-APK
          path: android-sms-gateway/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
